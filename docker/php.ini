; Configuración de PHP para ResiERP (hallazgos S6 y S7 de la auditoría)

; No anunciar la versión de PHP en las cabeceras
expose_php = Off

; Subidas coherentes con la validación de la aplicación (PDF de informes: 20 MB).
; Antes PHP permitía 2 MB y los PDF grandes fallaban sin explicación.
upload_max_filesize = 20M
post_max_size = 24M

; Analizar un PDF de 20 MB con pdfparser consume memoria: con 128 MB se agotaba
memory_limit = 256M
max_execution_time = 60

; Errores al log, nunca a la pantalla del usuario
display_errors = Off
log_errors = On

; Zona horaria del centro, para que las horas de los fichajes y del historial cuadren
date.timezone = Europe/Madrid

; La sesión la gestiona Laravel; estas son defensas por si algo usara la de PHP
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On
