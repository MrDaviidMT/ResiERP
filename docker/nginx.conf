# Configuración de nginx para ResiERP.
# La imagen es nginxinc/nginx-unprivileged, que no corre como root y escucha en 8080.

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # No anunciar la versión de nginx
    server_tokens off;

    # Coherente con php.ini y con la validación de la aplicación (PDF de 20 MB)
    client_max_body_size 24M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;

        # Solo para lo que sirve nginx: las respuestas de PHP traen las suyas de CabecerasSeguridad.
        # A nivel de server saldrían duplicadas, porque add_header añade en lugar de sustituir.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Solo se ejecuta el punto de entrada de Laravel: si algún día se subiera un .php
    # a public/, no sería ejecutable
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        include fastcgi_params;
    }

    location ~ \.php$ {
        deny all;
    }

    # Archivos ocultos (.env, .git...), salvo la verificación de Let's Encrypt
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
