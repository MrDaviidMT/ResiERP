# Configuración de nginx para ResiERP (hallazgos S8 y S9 de la auditoría).
# La imagen es nginxinc/nginx-unprivileged, que no corre como root y escucha en 8080.

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # No anunciar la versión de nginx
    server_tokens off;

    # Coherente con php.ini y con la validación de la aplicación (PDF de 20 MB).
    # Antes el límite era 1 MB y los PDF grandes fallaban con un error del servidor.
    client_max_body_size 24M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;

        # Solo para lo que sirve nginx (los assets compilados): las respuestas de la aplicación
        # ya traen estas cabeceras del middleware CabecerasSeguridad.
        #
        # A nivel de server se enviaban dos veces, porque add_header *añade* a lo que llega de
        # php-fpm en lugar de sustituirlo. Con X-Frame-Options duplicada, los navegadores que
        # encuentran varias declaraciones pueden descartar la política entera: la "segunda capa"
        # debilitaba justo lo que pretendía reforzar. Aquí no se aplican a las respuestas de PHP
        # porque la petición acaba en `location = /index.php`, que tiene su propia configuración.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Solo se ejecuta el punto de entrada de Laravel: si algún día se subiera un .php
    # a public/, no sería ejecutable
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        include fastcgi_params;
    }

    location ~ \.php$ {
        deny all;
    }

    # Archivos ocultos (.env, .git...), salvo la verificación de Let's Encrypt
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
