# Común a todos los servicios: reinicio, sin escalada de privilegios y logs con tope de tamaño
x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  nginx:
    # Imagen sin privilegios (no corre como root, escucha en 8080) con los archivos públicos dentro
    build:
      context: .
      target: web
    container_name: ResidenciaERP_nginx
    <<: *base
    mem_limit: 128m
    pids_limit: 100
    ports:
      - "80:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    depends_on:
      - app
    networks:
      - frontend

  app:
    build: .
    image: resierp-app
    container_name: ResidenciaERP_app
    <<: *base
    mem_limit: 1g
    pids_limit: 200
    volumes:
      - ./.env:/var/www/html/.env:ro
      - residentes_storage:/var/www/html/storage/app/private
    cap_drop:
      - ALL
    depends_on:
      mysql:
        # Espera a que MySQL responda de verdad: antes las migraciones del arranque
        # podían lanzarse con la base de datos aún iniciándose (hallazgo S9)
        condition: service_healthy
    networks:
      - frontend
      - backend

  # Tareas programadas (política de conservación). Comparte imagen y .env con "app";
  # schedule:work se queda en primer plano y lanza lo que toque cada minuto.
  scheduler:
    build: .
    image: resierp-app
    container_name: ResidenciaERP_scheduler
    <<: *base
    mem_limit: 512m
    pids_limit: 100
    entrypoint: ["php", "artisan", "schedule:work"]
    volumes:
      - ./.env:/var/www/html/.env:ro
      - residentes_storage:/var/www/html/storage/app/private
    cap_drop:
      - ALL
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  # Sembrado inicial, bajo demanda. Es el único contenedor que recibe .env.seed, y desaparece al terminar
  seed:
    profiles: [setup]
    build: .
    image: resierp-app
    <<: *base
    restart: "no"
    mem_limit: 512m
    pids_limit: 100
    env_file: .env.seed
    command: ["php", "artisan", "db:seed", "--force"]
    volumes:
      - ./.env:/var/www/html/.env:ro
    cap_drop:
      - ALL
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  mysql:
    image: mysql:8.4.13
    container_name: ResidenciaERP_mysql
    <<: *base
    mem_limit: 1g
    pids_limit: 300
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    volumes:
      - db_data:/var/lib/mysql
      # Privilegios mínimos para el usuario de la aplicación (hallazgo S12)
      - ./docker/mysql-privilegios.sh:/docker-entrypoint-initdb.d/10-privilegios.sh:ro
    healthcheck:
      # Sin credenciales: ping solo comprueba que el servidor responde
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      # Red interna: MySQL no es accesible desde fuera ni desde nginx
      - backend

# Solo MySQL la recibe: la aplicación se conecta con su usuario de privilegios mínimos
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password

volumes:
  db_data:
  residentes_storage:

networks:
  frontend:
  backend:
    internal: true
